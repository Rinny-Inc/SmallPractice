name: Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "23"
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.11

      - name: Build
        run: mvn -B clean package

      - name: Find artifact
        id: artifact
        shell: bash
        run: |
          JAR="$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*.jar' | head -n 1)"

          if [ -z "$JAR" ]; then
            echo "No JAR artifact found."
            exit 1
          fi

          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Rename artifact
        shell: bash
        run: |
          cp "${{ steps.artifact.outputs.jar }}" "SmallPractice-${GITHUB_REF_NAME#v}.jar"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SmallPractice ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            SmallPractice-*.jar
